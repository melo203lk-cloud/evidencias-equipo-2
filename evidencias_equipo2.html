:root{--bg:#f4faf7;--card:#ffffff;--ink:#111111;--line:#bfdccf;--accent:#2a9d8f;--accent2:#f4a261;--head:#b7e1cd;--zebra:#f1f8f4;--hl:#fff2cc;--soft:#e3f3ec;color-scheme:light}

const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------------- gráfica (SVG) ---------------- */
function chartSvg() {
  const W = 640, H = 340, L = 54, R = 16, T = 40, B = 62, max = 140;
  const pw = W - L - R, ph = H - T - B, gw = pw / DATA.length, bw = gw * 0.32;
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gráfica de barras del pulso en reposo y después del ejercicio de cinco participantes">';
  s += '<text x="' + W / 2 + '" y="22" text-anchor="middle" font-size="15" font-weight="bold" style="fill:var(--ink)">Pulso en reposo y después del ejercicio por participante</text>';
  for (let v = 0; v <= max; v += 20) {
    const y = T + ph - (v / max) * ph;
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--line)" stroke-width="1"/>';
    s += '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="12" style="fill:var(--ink)">' + v + '</text>';
  }
  s += '<text transform="rotate(-90)" x="' + (-(T + ph / 2)) + '" y="14" text-anchor="middle" font-size="12" style="fill:var(--ink)">Pulso (latidos/min)</text>';
  DATA.forEach((d, i) => {
    const cx = L + gw * i + gw / 2;
    [[d[2], '#2A9D8F', -bw], [d[3], '#F4A261', 0]].forEach((b) => {
      const h = (b[0] / max) * ph, x = cx + b[2], y = T + ph - h;
      s += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" fill="' + b[1] + '" stroke="#111" stroke-width="0.8"/>';
      s += '<text x="' + (x + bw / 2) + '" y="' + (y - 5) + '" text-anchor="middle" font-size="12" style="fill:var(--ink)">' + b[0] + '</text>';
    });
    s += '<text x="' + cx + '" y="' + (T + ph + 18) + '" text-anchor="middle" font-size="12" style="fill:var(--ink)">' + d[0] + '. ' + esc(d[1].split(' ')[0]) + '</text>';
  });
  s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '" stroke="#111" stroke-width="1.2"/>';
  s += '<text x="' + (L + pw / 2) + '" y="' + (H - 22) + '" text-anchor="middle" font-size="12" style="fill:var(--ink)">Participantes</text>';
  const lx = W - R - 250;
  s += '<rect x="' + lx + '" y="' + (H - 22) + '" width="12" height="12" fill="#2A9D8F" stroke="#111" stroke-width="0.6"/><text x="' + (lx + 18) + '" y="' + (H - 12) + '" font-size="12" style="fill:var(--ink)">En reposo</text>';
  s += '<rect x="' + (lx + 90) + '" y="' + (H - 22) + '" width="12" height="12" fill="#F4A261" stroke="#111" stroke-width="0.6"/><text x="' + (lx + 108) + '" y="' + (H - 12) + '" font-size="12" style="fill:var(--ink)">Después del ejercicio</text>';
  return s + '</svg>';
}

    '<section id="equipo"><h2>Equipo n.º 2 · Participamos los 9 integrantes</h2>' +

    DATA.map((d) => '<tr><td>' + d[0] + '</td><td>' + esc(d[1]) + '</td><td>' + d[2] + '</td><td' + (d[7] ? ' class="hl">' + d[3] + '*' : '>' + d[3]) + '</td><td>' + d[4] + '</td><td>' + d[5] + '</td><td>' + d[6] + '</td><td>Sí</td></tr>').join('') +

    '<h3>Tabla 3. Tiempo de cambio de color del indicador de col morada</h3><div class="scroll"><table><thead><tr><th>#</th><th>Voluntario</th><th>Tiempo en reposo (s)</th><th>Tiempo después del ejercicio (s)</th></tr></thead><tbody><tr><td>1</td><td>Alvarado Nieto Alexis Anthuan</td><td>45</td><td>7</td></tr><tr><td>2</td><td>Martínez Rojas Diego</td><td>27</td><td>8</td></tr></tbody></table></div>' +

    '</tbody></table></div><p class="note">E<sub>p</sub> = m · g · h = 60 × 9.8 × 0.4 = 235.2 J por sentadilla; kcal = J ÷ 4 184; energía real = kcal × 4 (aproximación didáctica de la guía).</p></section>' +

    '<section id="grafica"><h2>Gráfica del pulso</h2><div class="card">' + chartSvg() + '</div><p class="note">Figura 1. Comparación del pulso en reposo y después del ejercicio (valores de la Tabla 2, ya corregidos).</p></section>' +

    '<section id="evidencias"><h2>Evidencias: videos y fotografías</h2><div id="evid"></div></section>' +

    '<section id="qr"><h2>Código QR de esta página</h2><div class="card"><p>Pega aquí el enlace de esta página (en Claude: <b>Compartir → Copiar enlace</b>) para generar el QR que va en el reporte. Al escanearlo, la maestra entra directo a todas las evidencias.</p>' +

/* ---------------- evidencias ---------------- */
let CAN_EDIT = false;
function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : ''; }
function itemHtml(m, i) {
  let body = '';
  if (m.kind === 'video' && /^[0-9a-f]{32}$/.test(m.assetId || '')) body = '<video controls playsinline preload="metadata" src="/_blob/' + m.assetId + '"></video>';
  else if (m.kind === 'image' && /^[0-9a-f]{32}$/.test(m.assetId || '')) body = '<a href="/_blob/' + m.assetId + '" target="_blank" rel="noopener"><img loading="lazy" alt="' + esc(m.name || 'Evidencia') + '" src="/_blob/' + m.assetId + '"></a>';
  else if (m.kind === 'link' && safeUrl(m.url)) body = '<a class="btn" href="' + esc(safeUrl(m.url)) + '" target="_blank" rel="noopener">▶ Abrir video ↗</a>';
  else return '';
  return '<div class="item">' + body + '<div class="cap">' + esc(m.name || '') + '</div>' + (CAN_EDIT ? '<button class="del" data-i="' + i + '">Quitar</button>' : '') + '</div>';
}
function renderEvidence() {
  const box = $('#evid');
  if (!box) return;
  let h = '';
  if (CAN_EDIT) {
    h += '<div class="panel"><b>Panel del equipo (solo tú lo ves)</b>' +
      '<div class="row"><label for="slotsel">¿Dónde va?</label><select id="slotsel">' + SLOTS.map((s) => '<option value="' + s[0] + '">' + esc(s[1]) + '</option>').join('') + '</select></div>' +
      '<div class="row"><input type="file" id="file" accept="video/*,image/*" multiple style="display:none"><button class="btn" id="pick">Subir video o foto</button><span class="note">Máximo 20 MB por archivo. Mejor MP4 y fotos JPG/PNG.</span></div>' +
      '<div class="row"><input type="url" id="linkurl" placeholder="¿Pesa más? Pega el enlace (YouTube, Drive…)"><button class="btn alt" id="addlink">Agregar enlace</button></div></div>';
  }
  SLOTS.forEach((s) => {
    const items = STATE.media.map((m, i) => ({ m: m, i: i })).filter((x) => x.m.slot === s[0]).map((x) => itemHtml(x.m, x.i)).filter(Boolean);
    h += '<div class="slot"><h3>' + esc(s[1]) + '</h3>' +
      (items.length ? '<div class="media">' + items.join('') + '</div>' : '<div class="empty">Aún no hay evidencia en este apartado.</div>') + '</div>';
  });
  box.innerHTML = h;
  if (CAN_EDIT) {
    $('#pick').onclick = () => $('#file').click();
    $('#file').onchange = onFiles;
    $('#addlink').onclick = onLink;
    box.querySelectorAll('.del').forEach((b) => {
      b.onclick = () => {
        if (b.dataset.ok !== '1') { b.dataset.ok = '1'; b.textContent = '¿Seguro? Toca otra vez'; setTimeout(() => { b.dataset.ok = ''; b.textContent = 'Quitar'; }, 3500); return; }
        const next = { media: STATE.media.filter((_, i) => i !== Number(b.dataset.i)) };
        save(next, 'Quitando…');
      };
    });
  }
}

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, 5200); }
function busy(msg) { const b = $('#busy'); if (msg) { b.textContent = msg; b.style.display = 'flex'; } else b.style.display = 'none'; }

async function onFiles(ev) {
  const files = Array.from(ev.target.files || []);
  ev.target.value = '';
  if (!files.length) return;
  const slot = $('#slotsel').value;
  const assets = await claude.use('assets');
  if (!assets) { toast('No tienes permiso para subir archivos en esta vista.'); return; }
  const added = [];
  busy('Subiendo…');
  try {
    for (const f of files) {
      if (f.size > 20 * 1024 * 1024) { toast('“' + f.name + '” pesa más de 20 MB. Súbelo a YouTube o Drive y agrega el enlace.'); continue; }
      const isVid = (f.type || '').startsWith('video/'), isImg = (f.type || '').startsWith('image/');
      if (!isVid && !isImg) { toast('“' + f.name + '” no es video ni imagen.'); continue; }
      busy('Subiendo ' + f.name + '…');
      const r = await assets.upload(f);
      added.push({ slot: slot, kind: isVid ? 'video' : 'image', assetId: r.id, name: f.name });
    }
  } catch (e) {
    busy(null);
    toast(e && e.code === 'unsupported_type' ? 'Formato no admitido. Usa MP4 para video o JPG/PNG para fotos.' : 'No se pudo subir (' + ((e && e.code) || 'error') + ').');
    return;
  }
  if (!added.length) { busy(null); return; }
  save({ media: STATE.media.concat(added) }, 'Guardando evidencias…');
}
function onLink() {
  const u = $('#linkurl').value.trim();
  if (!safeUrl(u)) { toast('Pega un enlace que empiece con https://'); return; }
  const slot = $('#slotsel').value;
  const label = (SLOTS.find((s) => s[0] === slot) || [0, 'Video'])[1];
  save({ media: STATE.media.concat([{ slot: slot, kind: 'link', url: u, name: label + ' (enlace)' }]) }, 'Guardando enlace…');
}

/* ---------------- guardar = publicar una nueva versión de esta página ---------------- */
const S = '<scr' + 'ipt', E = '</scr' + 'ipt>';
const HEAD = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Evidencias · Práctica 1 · Equipo 2</title>' + S + ' src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js">' + E;
const LOADER = "(function(){var s=document.createElement('script');s.textContent=document.getElementById('code').textContent;document.body.appendChild(s);})();";
function buildHtml(state) {
  const css = document.getElementById('css').textContent;
  const code = document.getElementById('code').textContent;
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="es"><head>' + HEAD + '<style id="css">' + css + '</style></head><body><div id="app"></div><div id="toast"></div><div id="busy"></div>' +
    S + ' id="state" type="application/json">' + json + E + S + ' id="code" type="text/plain">' + code + E + S + '>' + LOADER + E + '</body></html>';
}
async function save(next, msg) {
  busy(msg || 'Guardando…');
  try {
    const art = await claude.use('artifact');
    if (!art) throw { code: 'unavailable' };
    await art.publish(buildHtml(next));
  } catch (e) {
    busy(null);
    const c = (e && e.code) || 'error';
    toast(c === 'not_writer' || c === 'not_granted' ? 'Esta vista es solo de lectura: abre la página desde tu cuenta para editar.' : c === 'conflict' ? 'La página se actualizó; se recargará.' : 'No se pudo guardar (' + c + '). Intenta de nuevo.');
  }
}

/* ---------------- QR ---------------- */
let QR_OK = false;
function makeQr() {
  const u = $('#qrurl').value.trim();
  if (!safeUrl(u)) { toast('Pega el enlace completo (empieza con https://).'); return; }
  if (typeof qrcode === 'undefined') { toast('No cargó el generador de QR. Revisa tu conexión y recarga.'); return; }
  const qr = qrcode(0, 'M'); qr.addData(u); qr.make();
  const n = qr.getModuleCount(), sc = 10, quiet = 4, size = (n + quiet * 2) * sc, cv = $('#qr'), ctx = cv.getContext('2d');
  cv.width = size; cv.height = size;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size); ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * sc, (r + quiet) * sc, sc, sc);
  $('#qrbox').style.display = 'flex';
  QR_OK = true;
}
async function downloadQr() {
  if (!QR_OK) return;
  const dl = await claude.use('downloads');
  const blob = await new Promise((res) => $('#qr').toBlob(res, 'image/png'));
  if (!dl) { toast('Descarga no disponible aquí: mantén presionado el QR y guarda la imagen, o toma captura.'); return; }
  try { await dl.save({ filename: 'QR_evidencias_equipo2.png', data: blob }); } catch (e) { if (!e || e.code !== 'declined') toast('No se pudo descargar (' + ((e && e.code) || 'error') + ').'); }
}

/* ---------------- arranque ---------------- */
render();
if (typeof claude !== 'undefined' && claude.use) {
  claude.use('assets').then((a) => { if (a) { CAN_EDIT = true; renderEvidence(); } }).catch(() => {});
}
})();
